name: Terraform Infrastructure

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:        # allows manual trigger from GitHub UI

# Required for OIDC token generation
# Without this GitHub Actions cannot request JWT token
permissions:
  id-token: write           # request OIDC JWT token
  contents: read            # read repo contents
  pull-requests: write      # post plan output as PR comment

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    defaults:
      run:
        working-directory: terraform    # all steps run inside terraform/

    steps:

      # ── Step 1: Checkout code ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 2: AWS OIDC Authentication ───────────────────────────────────
      # No static credentials needed
      # GitHub requests JWT → AWS verifies → returns temp credentials
      # Credentials valid for 1 hour only
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-${{ github.run_id }}

      # ── Step 3: Verify AWS identity ───────────────────────────────────────
      # Confirms OIDC worked correctly
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # ── Step 4: Setup Terraform ───────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # ── Step 5: Terraform Init ────────────────────────────────────────────
      # Initializes backend (S3 + DynamoDB)
      # Downloads required providers (AWS, Kubernetes etc)
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      # ── Step 6: Terraform Format Check ───────────────────────────────────
      # Fails if code is not properly formatted
      # Enforces consistent code style across team
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true       # warn but don't fail pipeline

      # ── Step 7: Terraform Validate ────────────────────────────────────────
      # Validates syntax and internal consistency
      # Does NOT call AWS API — purely local check
      - name: Terraform Validate
        run: terraform validate

      # ── Step 8: Terraform Plan ────────────────────────────────────────────
      # Shows exactly what will be created/modified/destroyed
      # Runs on BOTH push and pull_request
      # Critical: always review plan before apply
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan \
            -no-color \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      # ── Step 9: Post Plan to PR comment ──────────────────────────────────
      # Makes plan visible in PR for review
      # Industry standard — team reviews plan before approving PR
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength 
              ? plan.substring(0, maxLength) + '\n... truncated' 
              : plan;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan Output\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      # ── Step 10: Terraform Apply ──────────────────────────────────────────
      # Only runs on push to main branch (NOT on pull requests)
      # This is the key safety gate:
      #   PR → plan only (review and approve)
      #   Merge to main → plan + apply
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      # ── Step 11: Save outputs ─────────────────────────────────────────────
      # Captures EKS cluster name, VPC ID etc
      # Other pipelines can use these outputs
      - name: Terraform Output
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform output -json > ../infra-outputs.json

      - name: Upload Outputs as Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: infra-outputs
          path: infra-outputs.json
          retention-days: 30